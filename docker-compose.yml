# deepsproxy v2 — docker-compose
#
# Usage:
#   docker compose up -d                         # build (if needed) and start
#   docker compose logs -f                       # tail logs
#   docker compose exec deepsproxy npm test      # run tests INSIDE container
#   curl http://localhost:4000/health
#   open http://localhost:6080/vnc.html          # VNC for interactive login
#
# Ports:
#   4000 — proxy API + admin panel
#   5900 — VNC native (optional, use 6080 instead)
#   6080 — noVNC web client
#
# Volumes:
#   deepsproxy_data — SQLite DB + Chrome profiles + logs
#
# shm_size: 2gb is CRITICAL. Chrome crashes on /dev/shm default (64MB)
# when loading heavy SPAs like chat.deepseek.com.

services:
  deepsproxy:
    container_name: deepsproxy
    build:
      context: .
      dockerfile: Dockerfile
    image: deepsproxy:latest
    restart: unless-stopped
    shm_size: '2gb'

    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      API_KEY: ${API_KEY:-}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_TIMEOUT: ${PLAYWRIGHT_TIMEOUT:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # VNC stack
      DISPLAY_NUM: ${DISPLAY_NUM:-99}
      SCREEN_WIDTH: ${SCREEN_WIDTH:-1280}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-900}
      SCREEN_DEPTH: ${SCREEN_DEPTH:-24}
      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      # Chrome wrapper (used by Playwright and vnc-attach.sh)
      CHROME_BIN: /usr/local/bin/chrome-safe
      TZ: ${TZ:-America/Sao_Paulo}

    ports:
      - "${HOST_PORT:-4000}:4000"
      - "${HOST_VNC_PORT:-5901}:5900"
      - "${HOST_NOVNC_PORT:-6081}:6080"

    volumes:
      - ./deepsproxy:/app/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 512M

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
